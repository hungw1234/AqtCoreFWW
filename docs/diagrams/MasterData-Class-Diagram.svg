<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title description">
  <title id="title">MasterData Dictionary CRUD Class Diagram</title>
  <desc id="description">Compact UML-style class diagram matching the supplied sample. It traces MasterData dictionary commands and queries through controllers and handlers to EF Core and Dapper infrastructure.</desc>
  <defs>
    <style>
      text { font-family: Arial, "Segoe UI", sans-serif; fill: #20232a; }
      .heading { font-size: 23px; font-weight: 700; }
      .subheading { font-size: 12px; fill: #586174; }
      .stereotype { font-size: 10px; font-style: italic; fill: #303846; }
      .name { font-size: 12px; font-weight: 700; }
      .member { font-family: Consolas, "Courier New", monospace; font-size: 10px; }
      .relationship { font-size: 10px; fill: #414958; }
      .footnote { font-size: 10px; fill: #626b78; }
      .box { stroke-width: 1.5; rx: 2; }
      .validator { fill: #effaf2; stroke: #56ae68; }
      .handler { fill: #fff1f3; stroke: #e26070; }
      .command { fill: #e9f8ff; stroke: #25a8c8; }
      .query { fill: #fff9df; stroke: #e3b72b; }
      .controller { fill: #fff1ff; stroke: #d84ddd; }
      .infra { fill: #f3edff; stroke: #9975e8; }
      .dto { fill: #e7f6ff; stroke: #68aee0; }
      .divider { stroke-width: 1; }
      .line { fill: none; stroke: #525b68; stroke-width: 1.15; }
      .arrow { fill: #525b68; }
      .dashed { stroke-dasharray: 4 3; }
      .center { text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" class="arrow"/>
    </marker>
    <marker id="openArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#525b68" stroke-width="1"/>
    </marker>
  </defs>

  <rect width="1600" height="720" fill="#ffffff"/>
  <text x="34" y="34" class="heading">Class Diagram — MasterData (Dictionary CRUD)</text>
  <text x="34" y="53" class="subheading">Bố cục theo ảnh mẫu: Validator → Command/Query → Handler → Controller/Infrastructure → Domain Entity / DTO</text>

  <!-- Relations are behind the UML boxes. -->
  <!-- validators delegate validation to their command types -->
  <path d="M82 112 V164 H286 V258" class="line" marker-end="url(#openArrow)"/>
  <text x="170" y="158" class="relationship">Validate</text>
  <path d="M279 112 V258" class="line" marker-end="url(#openArrow)"/>
  <text x="287" y="190" class="relationship">Validate</text>
  <path d="M477 112 V164 H286" class="line" marker-end="url(#openArrow)"/>
  <text x="390" y="158" class="relationship">Validate</text>

  <!-- controller dispatches writes and reads -->
  <path d="M695 208 V142 H286 V258" class="line" marker-end="url(#arrow)"/>
  <text x="455" y="137" class="relationship">Gửi lệnh ghi (ISender)</text>
  <path d="M695 208 V174 H845 V258" class="line" marker-end="url(#arrow)"/>
  <text x="749" y="169" class="relationship">Gửi truy vấn đọc</text>
  <path d="M346 289 H490" class="line" marker-end="url(#arrow)"/>
  <text x="418" y="281" class="relationship center">MediatR</text>
  <path d="M845 320 V427" class="line" marker-end="url(#arrow)"/>
  <text x="855" y="382" class="relationship">MediatR</text>

  <!-- write handlers use EF context and domain model -->
  <path d="M560 320 V374 H260 V427" class="line" marker-end="url(#arrow)"/>
  <text x="372" y="368" class="relationship">Tạo / cập nhật entity</text>
  <path d="M560 320 V396 H94 V427" class="line" marker-end="url(#arrow)"/>
  <text x="318" y="392" class="relationship">Lưu qua EF Core</text>
  <path d="M560 320 V374 H760 V427" class="line" marker-end="url(#arrow)"/>
  <text x="647" y="368" class="relationship">Ghi dữ liệu</text>

  <!-- read handler delegates SQL to Dapper and maps to DTO -->
  <path d="M845 320 V386 H1031 V427" class="line" marker-end="url(#arrow)"/>
  <text x="912" y="380" class="relationship">Truy vấn SQL</text>
  <path d="M845 320 V405 H1288 V427" class="line" marker-end="url(#arrow)"/>
  <text x="1088" y="399" class="relationship">Ánh xạ dữ liệu</text>
  <path d="M1031 489 V535 H1288 V489" class="line dashed" marker-end="url(#arrow)"/>
  <text x="1092" y="531" class="relationship">Trả dữ liệu</text>

  <!-- model relationship -->
  <path d="M260 489 V566 H351 V605" class="line" marker-end="url(#arrow)"/>
  <text x="270" y="560" class="relationship">1 — 0..* Items</text>
  <path d="M351 605 V566 H490 V489" class="line dashed" marker-end="url(#openArrow)"/>
  <text x="402" y="558" class="relationship">ExternalMapping? (DictionaryId)</text>

  <!-- top row: validators -->
  <g>
    <rect x="30" y="70" width="104" height="42" class="box validator"/>
    <text x="82" y="85" class="stereotype center">«Validator»</text>
    <text x="82" y="101" class="name center">CreateDictionary</text>
  </g>
  <g>
    <rect x="224" y="70" width="110" height="42" class="box validator"/>
    <text x="279" y="85" class="stereotype center">«Validator»</text>
    <text x="279" y="101" class="name center">UpdateDictionary</text>
  </g>
  <g>
    <rect x="424" y="70" width="106" height="42" class="box validator"/>
    <text x="477" y="85" class="stereotype center">«Validator»</text>
    <text x="477" y="101" class="name center">CreateItem</text>
  </g>

  <!-- controller -->
  <g>
    <rect x="615" y="208" width="160" height="112" class="box controller"/>
    <text x="695" y="224" class="stereotype center">«Controller»</text>
    <text x="695" y="241" class="name center">DictionaryController</text>
    <line x1="615" y1="248" x2="775" y2="248" stroke="#d84ddd"/>
    <text x="625" y="264" class="member">+List(...)</text>
    <text x="625" y="278" class="member">+Create(...)</text>
    <text x="625" y="292" class="member">+Update(...), +Publish(...)</text>
    <text x="625" y="306" class="member">+ListItems(...), +CreateItem(...)</text>
  </g>

  <!-- commands -->
  <g>
    <rect x="226" y="258" width="120" height="62" class="box command"/>
    <text x="286" y="273" class="stereotype center">«Command»</text>
    <text x="286" y="289" class="name center">Dictionary Commands</text>
    <line x1="226" y1="295" x2="346" y2="295" stroke="#25a8c8"/>
    <text x="236" y="310" class="member">Create / Update / Publish / Item / Mapping</text>
  </g>

  <!-- write handler -->
  <g>
    <rect x="490" y="258" width="140" height="62" class="box handler"/>
    <text x="560" y="273" class="stereotype center">«Command Handler»</text>
    <text x="560" y="289" class="name center">EF Write Handlers</text>
    <line x1="490" y1="295" x2="630" y2="295" stroke="#e26070"/>
    <text x="500" y="310" class="member">Create / Update / Publish</text>
  </g>

  <!-- read query and handler -->
  <g>
    <rect x="790" y="258" width="110" height="62" class="box query"/>
    <text x="845" y="273" class="stereotype center">«Query»</text>
    <text x="845" y="289" class="name center">Read Queries</text>
    <line x1="790" y1="295" x2="900" y2="295" stroke="#e3b72b"/>
    <text x="845" y="310" class="member center">Dictionaries / Items</text>
  </g>
  <g>
    <rect x="960" y="427" width="142" height="62" class="box infra"/>
    <text x="1031" y="442" class="stereotype center">«Dapper»</text>
    <text x="1031" y="458" class="name center">IReadDbConnection</text>
    <line x1="960" y1="464" x2="1102" y2="464" stroke="#9975e8"/>
    <text x="1031" y="480" class="member center">QueryAsync&lt;T&gt;(...)</text>
  </g>
  <g>
    <rect x="790" y="427" width="110" height="62" class="box query"/>
    <text x="845" y="442" class="stereotype center">«Query Handler»</text>
    <text x="845" y="458" class="name center">Dictionaries / Items</text>
    <line x1="790" y1="464" x2="900" y2="464" stroke="#e3b72b"/>
    <text x="845" y="480" class="member center">Dapper read side</text>
  </g>

  <!-- infrastructure write persistence -->
  <g>
    <rect x="30" y="427" width="128" height="62" class="box infra"/>
    <text x="94" y="442" class="stereotype center">«EF Core»</text>
    <text x="94" y="458" class="name center">MasterDataDbContext</text>
    <line x1="30" y1="464" x2="158" y2="464" stroke="#9975e8"/>
    <text x="94" y="480" class="member center">Dictionaries / Items</text>
  </g>

  <!-- domain entities -->
  <g>
    <rect x="190" y="427" width="140" height="62" class="box handler"/>
    <text x="260" y="442" class="stereotype center">«Domain Entity»</text>
    <text x="260" y="458" class="name center">Dictionary</text>
    <line x1="190" y1="464" x2="330" y2="464" stroke="#e26070"/>
    <text x="260" y="480" class="member center">Code / Name / Status / Version</text>
  </g>
  <g>
    <rect x="420" y="427" width="140" height="62" class="box handler"/>
    <text x="490" y="442" class="stereotype center">«Domain Entity»</text>
    <text x="490" y="458" class="name center">ExternalMapping</text>
    <line x1="420" y1="464" x2="560" y2="464" stroke="#e26070"/>
    <text x="490" y="480" class="member center">Internal ↔ External Code</text>
  </g>
  <g>
    <rect x="281" y="605" width="140" height="62" class="box handler"/>
    <text x="351" y="620" class="stereotype center">«Domain Entity»</text>
    <text x="351" y="636" class="name center">DictionaryItem</text>
    <line x1="281" y1="642" x2="421" y2="642" stroke="#e26070"/>
    <text x="351" y="658" class="member center">Code / ParentId / SortOrder</text>
  </g>

  <!-- DTO returned by the query handlers -->
  <g>
    <rect x="1220" y="427" width="136" height="62" class="box dto"/>
    <text x="1288" y="442" class="stereotype center">«DTO»</text>
    <text x="1288" y="458" class="name center">DictionaryDto</text>
    <line x1="1220" y1="464" x2="1356" y2="464" stroke="#68aee0"/>
    <text x="1288" y="480" class="member center">PublicId / Code / Status</text>
  </g>
  <g>
    <rect x="1400" y="427" width="170" height="62" class="box dto"/>
    <text x="1485" y="442" class="stereotype center">«DTO»</text>
    <text x="1485" y="458" class="name center">DictionaryItemDto</text>
    <line x1="1400" y1="464" x2="1570" y2="464" stroke="#68aee0"/>
    <text x="1485" y="480" class="member center">PublicId / ParentId / Name</text>
  </g>
  <path d="M900 458 H1220" class="line" marker-end="url(#arrow)"/>
  <text x="1045" y="451" class="relationship">Projection / trả kết quả</text>
  <path d="M900 474 H1400" class="line dashed" marker-end="url(#arrow)"/>

  <text x="30" y="699" class="footnote">EF Core ghi dữ liệu; Dapper đọc dữ liệu. Domain liên kết Dictionary 1—N DictionaryItem; ExternalMapping có thể tham chiếu Dictionary.</text>
</svg>
