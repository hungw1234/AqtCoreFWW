{{/* AqtCoreFW — Kubernetes NetworkPolicy */}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aqtcorefw.fullname" . }}-network-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aqtcorefw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aqtcorefw.selectorLabels" . | nindent 6 }}

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow inbound only from the ingress controller namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

    # Allow inbound from Prometheus scraper (same namespace, monitoring label)
    {{- if .Values.networkPolicy.allowPrometheus }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}

  egress:
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow outbound to SQL Server
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dataNamespace }}
      ports:
        - protocol: TCP
          port: 1433

    # Allow outbound to Redis
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dataNamespace }}
      ports:
        - protocol: TCP
          port: 6379

    # Allow outbound to RabbitMQ / AMQP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dataNamespace }}
      ports:
        - protocol: TCP
          port: 5672

    # Allow outbound HTTPS to external APIs (Auth IdP, remote signing providers).
    # Vanilla NetworkPolicy cannot match egress by FQDN, so external 443 is narrowed
    # to explicit destination CIDRs when operators declare them; otherwise it falls
    # back to a broad (any-destination) 443 rule.
    #   strict:   set networkPolicy.egress.httpsCidrs to the provider egress CIDRs.
    #   fallback: httpsCidrs empty -> broad 443 (FQDN-based narrowing needs an egress
    #             gateway; deferred to the service-mesh pilot).
    {{- if .Values.networkPolicy.egress.httpsCidrs }}
    - to:
        {{- range .Values.networkPolicy.egress.httpsCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    {{- else }}
    # FALLBACK: no httpsCidrs declared -> allow 443 to any destination. This is the
    # only intentionally unscoped egress rule besides DNS; the NetworkPolicyEgressGuard
    # arch-test enforces that OTEL/internal ports are never left unscoped and that
    # populating httpsCidrs removes this block.
    - ports:
        - protocol: TCP
          port: 443
    {{- end }}

    # Allow outbound to the OTEL collector (trace/metric push) only when enabled.
    # Opt-in: no collector is configured today, so leaving it off keeps 4317/4318 from
    # being an unscoped egress hole. When enabled the ports are scoped to the collector
    # namespace (never any-destination).
    {{- if .Values.networkPolicy.egress.otel.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.otel.namespace }}
      ports:
        - protocol: TCP
          port: 4317   # OTEL gRPC
        - protocol: TCP
          port: 4318   # OTEL HTTP
    {{- end }}
{{- end }}
