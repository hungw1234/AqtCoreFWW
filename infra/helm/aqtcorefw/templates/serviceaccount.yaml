{{/* AqtCoreFW — ServiceAccount referenced by both the Deployment and the db-migrate Job.
     Rendered as a pre-install/pre-upgrade hook at weight -10 so it exists BEFORE the
     db-migrate hook Job (weight -5) creates its pod — hook resources are created before
     the chart's regular manifests, so a plain (non-hook) ServiceAccount would arrive too
     late and the Job pod would be rejected with "serviceaccount not found" (observed on
     the first-ever install, 2026-07-23). before-hook-creation keeps re-installs clean.
     CAVEAT: delete/recreate changes the ServiceAccount UID, which invalidates bound SA
     tokens already mounted in running pods (they keep the file, not its validity).
     Dormant today — nothing consumes SA tokens (Vault auth is AppRole/VAULT_TOKEN) —
     but revisit before enabling Vault Kubernetes-auth or any SA-token consumer. */}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aqtcorefw.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aqtcorefw.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
