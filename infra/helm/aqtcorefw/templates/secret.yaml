{{/* AqtCoreFW — Kubernetes Secret for sensitive configuration (Vault credentials)
     In production, prefer External Secrets Operator over this fallback template. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aqtcorefw.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aqtcorefw.labels" . | nindent 4 }}
  annotations:
    # CONTRACT: this Secret is CHART-OWNED — its content is fully determined by chart
    # values (Vault AppRole fallback). External population (ESO / pipelines / kubectl)
    # goes into the separate `aqtcorefw-secrets` Secret that the Deployment env and the
    # migrate Job reference — never into this one: the hook below recreates it from
    # values on every install/upgrade/rollback, wiping anything written from outside.
    # Pre-install hook (weight -10): the db-migrate hook Job (weight -5) envFroms this
    # Secret and hook pods run before regular manifests exist; pre-rollback keeps it in
    # sync with the rolled-back revision (a hook without pre-rollback would leave the
    # failed release's values live under the old code).
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  Vault__RoleId: {{ .Values.vault.roleId | default "" | quote }}
  Vault__SecretId: {{ .Values.vault.secretId | default "" | quote }}
