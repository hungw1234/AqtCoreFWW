name: CI

# Actions minutes on this private repo are a fixed free budget, so CI runs only where it buys
# evidence a local run cannot. Policy and the local pre-merge commands: docs/deployment-guide.md
# section 0 ("When CI runs"). Frontend lives in ci-frontend.yml so a web-only change does not
# pay for the .NET jobs and vice versa.
on:
  # Pre-merge CI only for high-risk backend paths: dependency/build config (a Linux build differs
  # from the macOS dev machines), migrations (the destructive-migration gate and Semgrep run only
  # here), auth, identity and audit, the shared kernel every module depends on, the hosts, and the
  # CI definition itself.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/ci.yml'
      - 'ci/**'
      - '**/Directory.Build.props'
      - '**/Directory.Packages.props'
      - 'src/global.json'
      - 'src/NuGet.config'
      - 'dotnet-tools.json'
      - '**/*.csproj'
      - '**/Migrations/**'
      - 'src/shared/**'
      - 'src/host/**'
      - 'src/modules/identity/**'
      - 'src/modules/audit/**'
      - '.semgrep/**'
      - 'infra/scripts/check-destructive-migrations.sh'
      - 'tests/architecture/**'
      - 'tests/quality-gates/**'
  # Every merged backend change is verified once on main; docs, plans, web, local scripts and
  # .http samples never start these jobs.
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'ci/**'
      - 'src/**'
      - '!src/http/**'
      - 'tests/**'
      - '.semgrep/**'
      - 'infra/scripts/check-destructive-migrations.sh'
      - 'dotnet-tools.json'
      - '!**/*.md'
  # Manual run for any branch: gh workflow run CI --ref <branch>
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# ─────────────────────────────────────────────────────────────────────────────
# All .NET jobs share this anchor for restore+build steps (NuGet cache shared)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1 — Build check + Unit tests + Coverage (parallel with integration)
  # ───────────────────────────────────────────────────────────────────────────
  unit-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # 25m: build (/warnaserror) + full unit/architecture suite across 41 projects on a
    # 2-core free runner exceeds 10m on a cold NuGet cache (the test step alone ran past
    # 10m on the first re-enabled run 2026-07-31). Generous headroom over the warm-cache time.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ci/unit.slnx

      - name: Build (warn-as-error)
        run: dotnet build ci/unit.slnx --no-restore -c Release /warnaserror

      # Scope = project path (ci/unit.slnx lists tests/unit/* + tests/architecture);
      # no FQN filter — integration projects are simply absent from this solution.
      - name: Test (Unit + Architecture) with coverage
        run: |
          dotnet test ci/unit.slnx \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=unit-results.trx" \
            --results-directory ./test-results

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool || true

      - name: Generate coverage JSON summary
        run: |
          reportgenerator \
            -reports:"test-results/**/coverage.cobertura.xml" \
            -targetdir:"test-results/coverage-report" \
            -reporttypes:JsonSummary || true

      - name: Check coverage thresholds
        run: |
          if [ -f "test-results/coverage-report/Summary.json" ]; then
            chmod +x tests/quality-gates/check-coverage.sh
            tests/quality-gates/check-coverage.sh \
              test-results/coverage-report/Summary.json 80 70 || \
              echo "::warning::Coverage below threshold — review coverage report"
          else
            echo "::warning::Coverage report not found — skipping threshold check"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            ./test-results/*.trx
            ./test-results/coverage-report/

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2a — Startup smoke tests: fresh-deploy path (seeding, DI resolution, RLS
  # wiring, Hangfire, outbox schema). Gates the fresh-deploy path that the full
  # integration suite below (still disabled) used to cover.
  #
  # Two fixture kinds run here: 2 classes honor TEST_USE_LOCAL_SQL and hit the
  # `sql` service container at localhost,1433; the other 5 self-spin their own
  # Testcontainers SQL (Docker is available on the GH ubuntu runner). Both are
  # serialized via the shared [Collection], so there is no env-var race.
  # ───────────────────────────────────────────────────────────────────────────
  smoke-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Ephemeral, disposable per-run CI SQL instance — never a real/prod credential.
          # Must equal the SA_PASSWORD job env below (LocalSqlOptions logs in as `sa`).
          MSSQL_SA_PASSWORD: "Gov@Test1234!"
        ports:
          - 1433:1433

    env:
      TEST_USE_LOCAL_SQL: "true"
      SA_PASSWORD: "Gov@Test1234!"

    steps:
      - uses: actions/checkout@v4

      # Free ~14GB on the GH ubuntu runner: android SDK, .NET preinstalled, haskell,
      # dotnet tooling caches. smoke-tests pulls mssql:2022-latest (~1.5GB), spins
      # 5 Testcontainers SQL instances, builds Release solution — repeated runner
      # disk-exhaust IOException observed on runs 31661054595 attempts 1+2.
      - name: Free runner disk space (smoke-tests only)
        run: |
          echo "Before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "After cleanup:"; df -h /

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/AqtCoreFW.slnx

      - name: Build
        run: dotnet build src/AqtCoreFW.slnx --no-restore -c Release

      - name: Wait for SQL Server (via service container's own sqlcmd)
        run: |
          for i in $(seq 1 30); do
            if docker exec "${{ job.services.sql.id }}" \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server ready after $i attempt(s)."
              exit 0
            fi
            echo "Waiting for SQL Server ($i/30)..."
            sleep 2
          done
          echo "::error::SQL Server did not become ready in time"
          exit 1

      - name: Test (Startup Smoke)
        run: |
          dotnet test tests/integration/AqtCoreFW.Startup.SmokeTests/AqtCoreFW.Startup.SmokeTests.csproj \
            --no-build -c Release \
            --filter "Category=Smoke" \
            --logger "trx;LogFileName=smoke-results.trx" \
            --results-directory ./test-results

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: ./test-results/*.trx

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2 — Integration tests with Testcontainers (parallel with unit)
  # ───────────────────────────────────────────────────────────────────────────
  integration-tests:
    # DISABLED 2026-04-18: plan plans/260418-0558-testcontainers-to-local-sql
    # Testcontainers cold-start on CI is slow and flaky. Dev must run locally via
    # TEST_USE_LOCAL_SQL=true against SQL Server 2022 before opening PR.
    # See docs/deployment-guide.md section "Running Integration Tests Locally".
    # The fresh-deploy path (seeding/DI/RLS-wiring) is now gated by the `smoke-tests`
    # job above; this full 197-test suite stays local-dev-only. Re-enable tracked in
    # backlogs/backlog.md.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ci/integration.slnx

      - name: Build
        run: dotnet build ci/integration.slnx --no-restore -c Release

      # Scope = project path (ci/integration.slnx lists all tests/integration/*
      # except Startup.SmokeTests, which the separate smoke-tests job owns);
      # no FQN filter — Resilience/Installation are plain members, run once.
      - name: Test (Integration — Testcontainers)
        run: |
          dotnet test ci/integration.slnx \
            --no-build -c Release \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./test-results/*.trx

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3 — Quality gates: SCA, secrets, SAST, migration safety (parallel)
  # ───────────────────────────────────────────────────────────────────────────
  quality-gates:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/AqtCoreFW.slnx

      - name: SCA — vulnerable package check
        env:
          SECURITY_SCAN_ENFORCE: ${{ vars.SECURITY_SCAN_ENFORCE || 'false' }}
        run: |
          mkdir -p reports
          dotnet list src/AqtCoreFW.slnx package \
            --vulnerable --include-transitive \
            > reports/vulnerable-packages.txt 2>&1 || true
          if [ "$SECURITY_SCAN_ENFORCE" = "true" ]; then
            if grep -qiE '(High|Critical)' reports/vulnerable-packages.txt; then
              echo "::error::HIGH/CRITICAL vulnerabilities found"
              cat reports/vulnerable-packages.txt
              exit 1
            fi
          fi

      - name: Secret scan (gitleaks pattern)
        run: |
          if grep -rn \
            -e 'password\s*=\s*"[^"]\{8,\}"' \
            -e 'secret\s*=\s*"[^"]\{8,\}"' \
            -e 'apikey\s*=\s*"[^"]\{8,\}"' \
            --include="*.cs" --include="*.ts" --include="*.json" \
            --exclude-dir=".git" --exclude-dir="bin" --exclude-dir="obj" \
            --exclude-dir="node_modules" --exclude-dir="test-results" \
            --exclude="*appsettings*.json" \
            . 2>/dev/null; then
            echo "::warning::Potential hardcoded secret found — review above matches"
          else
            echo "Secret scan passed."
          fi

      - name: DevSecOps — destructive migration gate
        run: |
          chmod +x infra/scripts/check-destructive-migrations.sh
          bash infra/scripts/check-destructive-migrations.sh
        env:
          BLOCK_DESTRUCTIVE: ${{ vars.BLOCK_DESTRUCTIVE_MIGRATIONS || 'false' }}

      - name: DevSecOps — Semgrep custom rules
        run: |
          if command -v semgrep &>/dev/null; then
            semgrep --config .semgrep/aqtcorefw-rules.yml src/ \
              --sarif --output reports/semgrep-results.sarif \
              --error || echo "::warning::Semgrep findings — review reports/semgrep-results.sarif"
          else
            pip install semgrep --quiet 2>/dev/null || true
            if command -v semgrep &>/dev/null; then
              semgrep --config .semgrep/aqtcorefw-rules.yml src/ \
                --sarif --output reports/semgrep-results.sarif \
                --error || echo "::warning::Semgrep findings — review reports/semgrep-results.sarif"
            else
              echo "::warning::Semgrep not available — skipping custom SAST rules"
            fi
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/

      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: reports/semgrep-results.sarif
        continue-on-error: true

  # ───────────────────────────────────────────────────────────────────────────
  # E2E tests (push to main only, after all tests pass)
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: false # Disabled until Docker infra fixed (issue #21)

    steps:
      - uses: actions/checkout@v4

      - name: Start backend services
        working-directory: infra/docker
        run: docker compose up -d --wait --timeout 60

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: web
        run: pnpm exec playwright test --reporter=html

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: web/playwright-report/

      - name: Stop services
        if: always()
        working-directory: infra/docker
        run: docker compose down

  # ───────────────────────────────────────────────────────────────────────────
  # Docker build + sign + SBOM (push to main only)
  # ───────────────────────────────────────────────────────────────────────────
  docker-build:
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: false # Disabled until Docker infra fixed (issue #21)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (for SBOM)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker-push
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker build -f src/host/AqtCoreFW.Api/Dockerfile -t $IMAGE .
          docker push $IMAGE
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX
          mkdir -p sbom
          dotnet CycloneDX src/AqtCoreFW.slnx --json --out sbom/

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image (keyless)
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
          cosign sign --yes $IMAGE

      - name: Attach SBOM attestation
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
          cosign attest --yes --type cyclonedx \
            --predicate sbom/bom.json \
            $IMAGE

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.docker-push.outputs.digest }}

  # ───────────────────────────────────────────────────────────────────────────
  # Docker integration tests — catches CORS, scope, proxy issues
  # ───────────────────────────────────────────────────────────────────────────
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests, integration-tests]
    if: false # Disabled until Docker infra fixed (issue #21)

    steps:
      - uses: actions/checkout@v4

      - name: Start Docker services
        working-directory: infra/docker
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services..."
          sleep 15
          docker ps --format "table {{.Names}}\t{{.Status}}"

      - name: Run smoke tests
        run: bash infra/docker/smoke-test.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Playwright
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium --with-deps

      - name: Run Docker integration E2E
        working-directory: web
        env:
          DOCKER_RUNNING: 'true'
        run: pnpm exec playwright test e2e/docker-integration.spec.ts --reporter=list

      - name: Tear down Docker
        if: always()
        working-directory: infra/docker
        run: docker compose down -v

  # ───────────────────────────────────────────────────────────────────────────
  # Performance smoke test (k6, push to main only)
  # ───────────────────────────────────────────────────────────────────────────
  perf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docker-integration
    if: false # Disabled until Docker infra fixed (issue #21)

    steps:
      - uses: actions/checkout@v4

      - name: Start Docker services
        working-directory: infra/docker
        run: docker compose up -d --wait --timeout 60

      - name: Run k6 smoke test (if k6 available)
        run: |
          if command -v k6 &> /dev/null; then
            k6 run tests/performance/smoke-test.js \
              --env API_URL=http://localhost:5001 \
              --out json=test-results/k6-smoke.json
          else
            echo "k6 not installed — installing via snap..."
            sudo snap install k6 2>/dev/null || \
            (curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6.gpg && \
             echo "deb [signed-by=/usr/share/keyrings/k6.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list && \
             sudo apt-get update -qq && sudo apt-get install -y k6) || \
            echo "::warning::k6 unavailable — skipping performance smoke test"
            if command -v k6 &> /dev/null && [ -f tests/performance/smoke-test.js ]; then
              k6 run tests/performance/smoke-test.js \
                --env API_URL=http://localhost:5001 \
                --out json=test-results/k6-smoke.json
            fi
          fi

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-results
          path: test-results/k6-smoke.json
        continue-on-error: true

      - name: Tear down Docker
        if: always()
        working-directory: infra/docker
        run: docker compose down -v

  # ───────────────────────────────────────────────────────────────────────────
  # Release approval gate (release branches only)
  # ───────────────────────────────────────────────────────────────────────────
  release-approval:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, quality-gates]
    if: startsWith(github.ref, 'refs/heads/release/')
    environment:
      name: release-approval
    timeout-minutes: 60

    steps:
      - name: Release gate passed
        run: |
          echo "All quality gates passed. Release approved by: ${{ github.actor }}"
          echo "Branch: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
